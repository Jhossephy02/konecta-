services:
  portal:
    build: .
    ports:
      - "127.0.0.1:8080:3001"
    environment:
      DEMO_MODE: ${DEMO_MODE:-true}
    volumes:
      - portal-data:/app/data
      - portal-backups:/app/backups
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/config').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  portal-data:
  portal-backups:
